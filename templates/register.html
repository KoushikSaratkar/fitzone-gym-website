{% extends 'base.html' %}{% block title %}Join FitZone{% endblock %}{% block content %}<section class="auth-wrap"><div class="auth-card"><span class="eyebrow">START STRONG</span><h1>Create your account.</h1><p class="muted">A few details and you're on your way.</p><form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" required minlength="2" value="{{ request.form.get('name','') }}"><label class="form-label">Email address</label><input class="form-control mb-3" type="email" name="email" required value="{{ request.form.get('email','') }}"><label class="form-label">Phone number</label><input class="form-control mb-3" name="phone" required minlength="8" maxlength="18" value="{{ request.form.get('phone','') }}"><label class="form-label">Password (minimum 8 characters)</label><input class="form-control mb-3" type="password" name="password" required minlength="8"><label class="form-label">Confirm password</label><input class="form-control mb-4" type="password" name="confirm_password" required minlength="8"><button class="btn btn-lime w-100">Create account</button></form><p class="mt-4 mb-0">Already a member? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
